<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Shopping Cart - ElectroMart</title>
    <link rel="stylesheet" href="style.css" />

</head>

<body class="homepage">

    <nav class="navbar" id="web-menu">
        <div class="navbar_container">
            <a href="index.html" id="navbar_logo"><img src="Pictures/ElectroMart.png" class="logo" alt=""></a>
            <div class="navbar_toggle" id="mobile-menu">
                <span class="bar"></span>
                <span class="bar"></span>
                <span class="bar"></span>
            </div>
            <ul class="navbar_menu">
                <li class="navbar_item">
                    <a href="" class="navbar_link">Search</a>
                </li>
                <li class="navbar_item">
                    <a href="profile.html" class="navbar_link">Profile</a>
                </li>
                <li class="navbar_item">
                    <a href="shoppingCart.html" class="navbar_link">Shopping Cart</a>
                </li>
                <!--<li class="navbar_item" id="signInLink">
                    <a href="signIn.html" class="navbar_link">Sign In</a>
                </li> -->
            </ul>
        </div>
    </nav>
    <div class="cart-container">
        <h1>Your Shopping Cart</h1>

        <div class="cart-item">
            <img src="Pictures/Samsung 970 evo.jpg" alt="Samsung SSD" />
            <div class="cart-details">
                <h3>Samsung 970 EVO</h3>
                <p>$189.99</p>
            </div>
            <div class="cart-actions">
                <input type="number" value="1" min="1" />
                <button>Remove</button>
            </div>
        </div>

        <div class="cart-item">
            <img src="Pictures/MSI RTX 5090.jpg" alt="MSI GPU" />
            <div class="cart-details">
                <h3>MSI RTX 5090</h3>
                <p>$2499.99</p>
            </div>
            <div class="cart-actions">
                <input type="number" value="1" min="1" />
                <button>Remove</button>
            </div>
        </div>

        <div class="total">
            Total: $2,689.98
        </div>
        <button class="checkout-btn">Proceed to Checkout</button>
    </div>

    <Script src="app.js"></Script>
</body>

</html>
